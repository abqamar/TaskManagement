name: Node.js CI

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================
  # JOB 1: Build and Integration Tests
  # ============================================
  build-and-test:
    name: Build and Integration Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskapp:testpassword@localhost:5432/task_management_test?schema=public

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: task_management_test

        ports:
        - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskapp -d task_management_test" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: TypeScript type checking
      run: npm run typecheck

    - name: Build application
      run: npm run build

    - name: Apply database migrations
      run: npx prisma migrate deploy

    - name: Run automated tests
      run: npm run test:ci

  # ============================================
  # JOB 2: Docker Build Verification
  # ============================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    needs:
    - build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        target: runtime
        push: false
        tags: task-management-api:ci
        build-args: |
          REPOSITORY_URL=https://github.com/${{ github.repository }}

  # ============================================
  # JOB 3: Publish Docker Image to GHCR
  # ============================================
  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest

    needs:
    - build-and-test
    - docker-build

    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Docker image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest
          type=sha,format=long,prefix=sha-

    - name: Build and publish multi-platform image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        target: runtime
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          REPOSITORY_URL=https://github.com/${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
