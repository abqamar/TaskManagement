name: Node.js CI

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Integration Tests

    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskapp:testpassword@localhost:5432/task_management_test?schema=public

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: task_management_test

        ports:
        - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskapp -d task_management_test" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: TypeScript type checking
      run: npm run typecheck

    - name: Build application
      run: npm run build

    - name: Apply database migrations
      run: npx prisma migrate deploy

    - name: Run automated tests
      run: npm run test:ci
