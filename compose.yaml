## 12. Learn container management

Now let's practice the Docker commands you'll use regularly.

| Command | Purpose |
|---|---|
| `docker ps` | Show running containers |
| `docker compose ps -a` | Show all project containers |
| `docker compose logs api` | Show API logs |
| `docker compose restart api` | Restart the API |
| `docker compose stop` | Stop services |
| `docker compose start` | Start existing services |
| `docker compose down` | Remove project containers and network |
| `docker images` | List Docker images |
| `docker volume ls` | List Docker volumes |

For Compose commands, use `--env-file .env.docker` as in our examples.

### Access PostgreSQL inside Docker

Run:

```bash
docker compose --env-file .env.docker exec db \
  psql -U taskapp -d task_management
```

Inside PostgreSQL:

```sql
SELECT id, title, status FROM "Task";
```

You should see tasks created through your API.

Exit using `\q`.

### Understand persistent volumes

Run:

```bash
docker compose --env-file .env.docker down
```

Then start again:

```bash
docker compose --env-file .env.docker up -d
```

Your existing tasks should still be present.

That's because PostgreSQL data is stored in a Docker named volume, which survives ordinary container removal.

<box gap={1}>
  <row align="center" gap={2}>
    <icon name="alert-triangle" color="danger"/>
    **Important: Don't accidentally delete your database**
  </row>
  Avoid running `docker compose down -v` unless you intentionally want to delete the project's database volume and its stored data. Docker volumes are not substitutes for database backups.
</box>

