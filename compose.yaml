
services:

  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - task-network

  migrate:
    build:
      context: .
      target: runtime

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

    networks:
      - task-network

  api:
    build:
      context: .
      target: runtime

    restart: unless-stopped

    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - task-network

networks:
  task-network:
    driver: bridge

volumes:
  postgres_data:
```

Docker Compose supports waiting for a service to become healthy and for a one-off migration service to complete successfully before starting dependent services. <Cite ref="turn594579search2"/>

### Understanding our three services

<box gap={2}>
  <row gap={3} align="start">
    <box background="surface-secondary" radius="lg" padding={3}>
      <icon name="database" size="lg"/>
    </box>
    <box flex="1" gap={1}>
      **`db` — PostgreSQL**

      Runs PostgreSQL 17 and stores its data in the `postgres_data` Docker volume. It is not exposed directly to your Mac's network.
    </box>
  </row>
  <divider color="subtle"/>
  <row gap={3} align="start">
    <box background="surface-secondary" radius="lg" padding={3}>
      <icon name="database-zap" size="lg"/>
    </box>
    <box flex="1" gap={1}>
      **`migrate` — Prisma migrations**

      Runs `prisma migrate deploy` after PostgreSQL becomes healthy. It should finish successfully before the API starts.
    </box>
  </row>
  <divider color="subtle"/>
  <row gap={3} align="start">
    <box background="surface-secondary" radius="lg" padding={3}>
      <icon name="server" size="lg"/>
    </box>
    <box flex="1" gap={1}>
      **`api` — Express REST API**

      Runs the compiled TypeScript application on port 3000, connecting to PostgreSQL using the Docker hostname `db`.
    </box>
  </row>
</box>

The configuration is deliberately local-development-focused. We bind the HTTP port to `127.0.0.1`, so it's accessible from your Mac but not publicly exposed on the network. We'll create a separate production deployment configuration later.

