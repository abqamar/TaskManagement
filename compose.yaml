## 13. Add Docker build verification to GitHub Actions

Now we'll integrate Docker into the CI pipeline created in Phase 3.

Our current workflow tests Node.js and PostgreSQL successfully. However, it doesn't yet verify that the application can be packaged into a Docker image.

We should test that automatically.

Open:

`.github/workflows/ci.yml`

Under `jobs`, add this second job at the same indentation level as your existing `build-and-test` job:

<CodeBlock language="yaml" editable>
  docker-build:
    name: Docker Build Verification

    runs-on: ubuntu-latest

    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: task-management-api:ci
