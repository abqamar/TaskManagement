## 9. Build the Docker image

Before building, stop the Node.js API that's running directly on your Mac using `Ctrl+C` to avoid a port conflict.

Now run:

```bash
docker compose --env-file .env.docker build
```

This builds our application image from the Dockerfile.

Docker will:

1. Download the Node.js 24 base image if needed.
2. Install npm dependencies.
3. Generate Prisma Client.
4. Compile the TypeScript project.
5. Create the runtime image.

This is your first Dockerized Node.js application.

## 10. Start the containers

Run:

```bash
docker compose --env-file .env.docker up -d
```

Then inspect the container statuses:

```bash
docker compose --env-file .env.docker ps -a
```

Expected states:

| Service | Expected state |
|---|---|
| `db` | Running, healthy |
| `migrate` | Exited successfully (code 0) |
| `api` | Running, healthy |

A stopped `migrate` container is normal because it is a one-off job.

View the API logs:

```bash
docker compose --env-file .env.docker logs -f api
```

You should see output similar to:

```text
PostgreSQL connected successfully
===================================
Task Management API
Environment: production
URL: http://localhost:3000
PostgreSQL: Connected
===================================
```

Although the API is in Docker's production runtime mode, this is still a local learning environment, not an internet-facing production deployment.

